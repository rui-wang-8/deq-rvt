import os
import shutil
import sys

import lit.formats
import lit.util

# --- Configuration of the RVT-for-KLEE test suite -------------------------
#
# Environment needed (see scripts/run-tests.sh):
#   RVT_DIR - the root of this repository
#   A rustc 1.81.x toolchain (the demos pin it via rust-toolchain.toml)
#   KLEE installed at $RVT_DIR/tools/klee (scripts/build-klee.sh)
#   cargo-verify and rvt-patch-llvm installed at $RVT_DIR/tools/bin

config.name = "RVT-KLEE"
config.suffixes = [".test"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(
    os.environ.get("RVT_DIR", os.path.dirname(os.path.dirname(__file__))),
    "tests",
    "build",
)
# NOTE: lit's per-test timeout is a CLI option (--timeout); run the suite
# via scripts/run-tests.sh, which passes --timeout=1200.

rvt_dir = os.environ["RVT_DIR"]

# --- Substitutions ---------------------------------------------------------

klee_bin = os.path.join(rvt_dir, "tools", "klee", "bin", "klee")
filecheck = shutil.which("FileCheck-18") or shutil.which("FileCheck")
if filecheck is None:
    lit_config.fatal("FileCheck not found")

config.substitutions.append(("%rvt_dir", rvt_dir))
config.substitutions.append(("%python", '"%s"' % (sys.executable,)))
config.substitutions.append(("%klee", klee_bin))
config.substitutions.append(
    ("%cargo-verify", os.path.join(rvt_dir, "tools", "bin", "cargo-verify"))
)
config.substitutions.append(
    ("%rvt-patch-llvm", os.path.join(rvt_dir, "tools", "bin", "rvt-patch-llvm"))
)
config.substitutions.append(("%FileCheck", filecheck))

# --- Environment -----------------------------------------------------------

tools_bin = os.path.join(rvt_dir, "tools", "bin")
klee_bin_dir = os.path.dirname(klee_bin)
config.environment["RVT_DIR"] = rvt_dir
config.environment["KLEE_DIR"] = os.path.join(rvt_dir, "tools", "klee")
config.environment["CARGO_HOME"] = os.path.join(rvt_dir, ".cargo-home")
config.environment["LLVM_VERSION"] = "18"
config.environment["PATH"] = os.pathsep.join(
    [klee_bin_dir, tools_bin, os.environ.get("PATH", "")]
)

# --- Test format -----------------------------------------------------------

config.test_format = lit.formats.ShTest(True)
