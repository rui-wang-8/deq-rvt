[package]
name = "rvt-patch-llvm"
version = "0.2.0"
authors = ["Shaked Flur <sflur@gmail.com>"]
edition = "2021"
description = "Preprocess rustc-generated LLVM IR for verification backends (KLEE)"
license = "MIT OR Apache-2.0"

[dependencies]
log  = "0.4"
stderrlog = "0.5"
structopt = "0.3"
regex = "1"

# Supports LLVM 18 (used by both rustc 1.81 bitcode emission and KLEE 3.x).
inkwell = { version = "0.10", default-features = false, features = ["llvm18-1-prefer-dynamic"] }
